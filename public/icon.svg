<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f3d"/>
      <stop offset="100%" stop-color="#17111f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mandala ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#e0c893" stroke-width="4" opacity="0.8"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#c9b3f0" stroke-width="2" stroke-dasharray="10 22" opacity="0.6"/>

  <!-- Cardinal diamonds -->
  <g fill="#e0c893">
    <rect x="246" y="72" width="20" height="20" transform="rotate(45 256 82)"/>
    <rect x="246" y="420" width="20" height="20" transform="rotate(45 256 430)"/>
    <rect x="72" y="246" width="20" height="20" transform="rotate(45 82 256)"/>
    <rect x="420" y="246" width="20" height="20" transform="rotate(45 430 256)"/>
  </g>

  <!-- Lotus petals -->
  <g fill="#7c5cbf" stroke="#c9b3f0" stroke-width="3" opacity="0.95">
    <ellipse cx="256" cy="168" rx="26" ry="58"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(45 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(90 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(135 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(180 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(225 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(270 256 256)"/>
    <ellipse cx="256" cy="168" rx="26" ry="58" transform="rotate(315 256 256)"/>
  </g>

  <!-- Core -->
  <circle cx="256" cy="256" r="34" fill="#e8d7f7"/>
  <circle cx="256" cy="256" r="18" fill="#e0c893"/>
</svg>
